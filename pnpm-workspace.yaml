packages:
  # Desktop is an independent nested pnpm workspace with its own lockfile and
  # packages/tidgi-shared. Do not install it through the Mobile/root lockfile.
  - apps/mobile

overrides:
  '@electron/rebuild': 4.2.0
  'git-sync-js>fs-extra': 11.4.0
  node-abi: 4.33.0
  prebuild-install: latest
  node-addon-api: ^7.1.1

peerDependencyRules:
  allowedVersions:
    memeloop: '>=0.1.0 <0.3.0'

allowBuilds:
  bufferutil: true
  protobufjs: false
  puppeteer: false

# These exact first-party releases were manually reviewed and published as part
# of the coordinated MemeLoop release. Keep pnpm 11's release-age policy for
# every other package and for all future MemeLoop versions.
minimumReleaseAgeExclude:
  - '@memeloop/libp2p@0.2.4'
  - '@memeloop/react-ui@0.1.6'
  - memeloop-cli@0.2.6
  - memeloop@0.2.8
