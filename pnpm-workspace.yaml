packages:
  # Desktop is an independent nested pnpm workspace with its own lockfile and
  # packages/tidgi-shared. Do not install it through the Mobile/root lockfile.
  - apps/mobile

overrides:
  '@electron/rebuild': 4.2.0
  'git-sync-js>fs-extra': 11.4.0
  node-abi: 4.33.0
  prebuild-install: latest
  node-addon-api: ^7.1.1

peerDependencyRules:
  allowedVersions:
    memeloop: '>=0.1.0 <0.3.0'

allowBuilds:
  bufferutil: true
  protobufjs: false
  puppeteer: false

# These exact first-party releases were manually reviewed and the Expo entries
# form the SDK 57 compatibility set selected by `expo install --check`. Keep
# pnpm 11's release-age policy for every future version.
minimumReleaseAgeExclude:
  - '@memeloop/libp2p@0.2.5'
  - '@memeloop/react-ui@0.1.7'
  - memeloop-cli@0.2.7
  - memeloop@0.2.9
  - '@expo/cli@57.0.19'
  - '@expo/inline-modules@0.1.7'
  - '@expo/local-build-cache-provider@57.0.8'
  - '@expo/log-box@57.0.4'
  - '@expo/metro-config@57.0.11'
  - '@expo/metro-runtime@57.0.14'
  - '@expo/prebuild-config@57.0.15'
  - '@expo/router-server@57.0.8'
  - '@expo/ui@57.0.14'
  - babel-preset-expo@57.0.9
  - expo-asset@57.0.15
  - expo-constants@57.0.15
  - expo-file-system@57.0.6
  - expo-linking@57.0.8
  - expo-modules-autolinking@57.0.12
  - expo-modules-core@57.0.14
  - expo-modules-jsi@57.0.6
  - expo-router@57.0.17
  - expo-secure-store@57.0.2
  - expo@57.0.17
  - expo-build-properties@57.0.15
